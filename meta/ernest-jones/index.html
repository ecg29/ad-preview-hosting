<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ernest Jones - Meta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      min-height: 100vh;
      color: #888;
      padding: 20px;
    }
    
    /* Minimal Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid #222;
    }
    .header-left a { color: #555; text-decoration: none; font-size: 0.8rem; }
    .header-left a:hover { color: #888; }
    .header-center { 
      text-align: center;
      flex: 1;
    }
    .header-center h1 { 
      font-size: 1rem; 
      font-weight: 400; 
      color: #aaa;
    }
    .header-center span { font-size: 0.75rem; color: #555; }
    .header-right { font-size: 0.75rem; color: #444; }
    
    /* Locale Filter */
    .filters {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 30px;
    }
    .filter-btn {
      padding: 5px 12px;
      background: transparent;
      border: 1px solid #333;
      color: #666;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .filter-btn:hover { border-color: #555; color: #999; }
    .filter-btn.active { border-color: #0af; color: #0af; }
    
    /* Size Section */
    .size-section { margin-bottom: 40px; }
    .size-label {
      font-size: 0.7rem;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      padding-left: 2px;
    }
    
    /* Creatives Grid */
    .creatives-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-end;
    }
    
    /* Each creative - minimal wrapper */
    .creative {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .creative.hidden { display: none !important; }
    
    /* The actual iframe - no extra padding */
    .creative iframe {
      display: block;
      border: none;
      background: #fff;
    }
    
    /* Tiny info bar below creative */
    .creative-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      gap: 10px;
      width: 100%;
      max-width: 100%;
    }
    .creative-info .locale {
      font-size: 0.65rem;
      color: #0af;
      text-transform: uppercase;
    }
    .creative-info .name {
      font-size: 0.65rem;
      color: #444;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: center;
    }
    .creative-info .actions {
      display: flex;
      gap: 6px;
    }
    .creative-info a, .creative-info button {
      font-size: 0.65rem;
      color: #555;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 2px;
    }
    .creative-info a:hover, .creative-info button:hover {
      color: #0af;
      background: rgba(0,170,255,0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../">← Meta</a>
    </div>
    <div class="header-center">
      <h1>Ernest Jones</h1>
      <span>4 creatives</span>
    </div>
    <div class="header-right">11/27/2025</div>
  </header>
  
  
  
  
  <section class="size-section">
    <div class="size-label">970×250</div>
    <div class="creatives-grid">
      
      <div class="creative" data-locale="Default">
        <iframe src="ernest-jones-gift-finder-studio-970x250/" width="970" height="250" scrolling="no" loading="lazy"></iframe>
        <div class="creative-info" style="width: 970px;">
          <span class="locale">Default</span>
          <span class="name" title="ernest_jones_gift_finder_studio_970x250">ernest_jones_gift_finder_studio_970x250</span>
          <span class="actions">
            <a href="ernest-jones-gift-finder-studio-970x250/" target="_blank">↗</a>
            <button onclick="navigator.clipboard.writeText(location.href+'ernest-jones-gift-finder-studio-970x250/');this.textContent='✓';setTimeout(()=>this.textContent='⎘',1000)">⎘</button>
          </span>
        </div>
      </div>
    </div>
  </section>

    <div class="creatives-grid">

    </div>
  </section>
  
  <section class="size-section">
    <div class="size-label">336×280</div>
    <div class="creatives-grid">
      
      <div class="creative" data-locale="Default">
        <iframe src="ernest-jones-gift-finder-studio-336x280/" width="336" height="280" scrolling="no" loading="lazy"></iframe>
        <div class="creative-info" style="width: 336px;">
          <span class="locale">Default</span>
          <span class="name" title="ernest_jones_gift_finder_studio_336x280">ernest_jones_gift_finder_studio_336x280</span>
          <span class="actions">

        <div class="creative-info" style="width: 300px;">
          <span class="locale">Default</span>

          </span>
        </div>
      </div>
    </div>
  </section>
  
  
  <script>
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        document.querySelectorAll('.creative').forEach(c => {
          c.classList.toggle('hidden', f !== 'all' && c.dataset.locale !== f);
        });
      });
    });
  </script>
</body>
</html>
